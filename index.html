  <head>
    <meta charset="UTF-8" />

      name="description"

    <meta name="theme-color" content="#f7f6f5" />

    <meta property="og:image" content="%BASE_URL%images/profile-img-1280.webp" />
    <!-- Aplica el tema guardado antes de pintar, para que no parpadee -->
    <script>
      (function () {
        var t = 'light'
        try {
          t = localStorage.getItem('fc-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (e) {}
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
